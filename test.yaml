program: test_norm.py
method: grid
name: ResNet18_CIFAR10_TRADES_MART
metric:
  goal: maximize
  name: Robust_acc

# sweep_id: "kt3daewh"

parameters:
  # seed: 
    # values: [42, 374829, 582947, 194837, 920157, 647382, 813940, 562718, 731209, 284950]
  seed:
    values: [42, 374829, 582947]
  # architecture:
    # values : ["resnet18", "resnet50", "resnet101", "wide_resnet28_10", "wide_resnet50", "wide_resnet101", "vit", "swin"]
  architecture:
    values: ["resnet18"]
  model_norm:
    values: [True, False]
  pretrain:
    values: [False]
  # dataset:
  #   values: ["MNIST", "CIFAR10", "ImageNet100", "ImageNet"]
  dataset:
    values: ["CIFAR10"]
  lr:
    values: [0.01]
