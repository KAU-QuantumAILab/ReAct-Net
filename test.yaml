  #   values: ["brelu", "relu", "gelu"]
  optimizer: 
    values: ["AdamW"]
  beta1:
    values: [0.9]
  beta2:
    values: [0.999]
  batch_size:
    value: 512
  num_workers:
    value: 16
  lr_scheduler:
    values: [True]
  epochs:
    value: 100
  adv:
    values: [True]
  adv_mode:
    # values: ["standard", "trades", "mart"]
    values: ["trades", "mart"]
  beta:
    values: [5.0]
  eps:
    values: [0.03]
  replaceAll:
    values: [True]
