method: bayes
metric:
  goal: maximize
  name: val_acc
name: ImageNet100-resnet18-adv
parameters:
  activation:
    value: relu
  adv:
    value: true
  adv_epsilon:
    value: 0.03137254901960784
  architecture:
    value: resnet18
  batch_size:
    values:
      - 128
      - 256
  dataset:
    value: ImageNet
  epochs:
    values:
      - 100
  lr:
    distribution: uniform
    max: 0.1
    min: 0.0001
  lr_scheduler:
    value: false
  num_workers:
    values:
      - 24
  optimizer:
    values: 
      - SGD
      - Adam
  replace_all:
    value: false

program: sweep.py